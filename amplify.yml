version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci --no-audit --no-fund
    build:
      commands:
        # The server reads AWS through the compute role; these only name the resources.
        - printf 'HERMES_REGION=us-east-1\nHERMES_BUCKET=hermes-638175140432\nHERMES_LEDGER_TABLE=hermes-ledger\n' > .env.production
        # Sign-in and admin settings come from the Amplify app's environment; the server only sees them through .env.production.
        - env | grep -E '^(HERMES_COGNITO_CLIENT_ID|HERMES_COGNITO_POOL_ID|ADMIN_EMAILS|HERMES_URL|HERMES_MAIL_FROM|HERMES_AUTOSCORE)=' >> .env.production
        - npx next build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
